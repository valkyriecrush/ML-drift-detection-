[project]
name = "agentic-drift-stress-fusion"
version = "0.4.0"
description = "Multi-agent LangGraph drift/performance monitoring (agentic_drift_stress) wired onto a real LightGBM diabetes-risk pipeline (drift_simulator), via bridge/."
requires-python = ">=3.10"

# AUDIT P2 FIX (hygiene du depot / packaging) : avant ce fichier, il n'y
# avait NI pyproject.toml NI setup.py -- tout reposait sur des
# sys.path.insert() manuels dans chaque script d'entree (run_scenario.py,
# bridge/real_scenario_runner.py, tests/conftest.py), et sur DEUX
# requirements.txt distincts (racine + drift_simulator/) sans lock file,
# sans garantie de reproductibilite des versions entre environnements.
#
# Ce fichier ne supprime pas les sys.path.insert() existants (agentic_drift_
# stress/ et drift_simulator/ restent deux sous-projets avec des hypotheses
# de CWD differentes -- drift_simulator/ doit tourner avec CWD=drift_simulator/
# pour ses chemins relatifs config/, data/, models/, baseline/.cache -- un
# vrai passage a l'empaquetage complet, avec chemins portables independants
# du CWD, est un chantier plus large que ce fix). Il fournit en revanche UNE
# source de verite installable (`pip install -e .`) pour les dependances, en
# remplacement des deux requirements.txt divergents.
dependencies = [
    # --- agentic_drift_stress (agent LangGraph) ---
    "langgraph>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    # --- drift_simulator (pipeline reelle : preprocessing + modele LightGBM) ---
    "pyyaml>=6.0",
    "lightgbm>=4.0",
    "xgboost>=2.0",   # AUDIT FIX : utilise par src/modeling.py mais jamais declare nulle part avant ce fix
    "joblib>=1.3",
    "shap>=0.45",
    # --- alerting : fichier local (toujours) + serveur mock optionnel + vrai SMTP optionnel ---
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # smtplib (envoi SMTP reel, bridge/configure_real_channels.py) : stdlib, rien a installer
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
